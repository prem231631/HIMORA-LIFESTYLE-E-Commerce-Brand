
services:
  db:
    image: postgres:16-alpine
    container_name: himora_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: himora_lifestyle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - himora_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d himora_lifestyle"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: himora_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/himora_lifestyle
      APP_ENV: production
      DEBUG: "false"

    ports:
      - "8000:8000"

    volumes:
      - ./backend/uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: himora_frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  himora_postgres_data:
