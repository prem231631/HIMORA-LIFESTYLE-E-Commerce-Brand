server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support React Router routes such as /reset-password/TOKEN
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent browser caching of the main HTML entry point
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}